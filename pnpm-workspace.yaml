# pnpm 10 reads settings from this file; the "pnpm" field in package.json
# is ignored.

overrides:
  vitefu: ^1.1.3
  # workerd 1.20260730.1 and older crash on Apple Silicon under `vite dev`
  # (V8 Maglev CHECK in Assembler::bind -> SIGTRAP), so Miniflare drops the
  # socket with "fetch failed". The stable Miniflare 4.x line still pins an
  # affected build, so pin the fixed runtime until a stable Miniflare ships it.
  workerd: 1.20260927.1
